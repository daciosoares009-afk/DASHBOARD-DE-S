services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: "https://${DOMAIN:?Defina DOMAIN}"
      TRUST_PROXY: "1"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{headers:{'X-Forwarded-Proto':'https'}}).then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?Defina DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
